<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light">
  <title>kumparan | Meja Redaksi</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2300B2A9'/%3E%3Cpath d='M9 8v9a7 7 0 0 0 14 0V8' fill='none' stroke='%23fff' stroke-width='4' stroke-linecap='round'/%3E%3Cpath d='M11 8v6l5 4 5-4V8' fill='%23E8174E'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <noscript><p style="padding:24px">Aktifkan JavaScript di browser untuk memakai aplikasi ini.</p></noscript>

  <img class="corner-logo" src="img/logo-kumparan.webp" alt="kumparan" width="1024" height="256">

  <!-- Masuk -->
  <div id="login" class="login" hidden>
    <form id="login-form" class="login-card" autocomplete="off">
      <h1 class="login-logo"><img src="img/logo-kumparan.webp" alt="kumparan" width="1024" height="256"></h1>
      <p>Teman kerja jurnalis dan editor buat menyiapkan draf. Masukkan kata sandi dari admin redaksi.</p>
      <label for="login-pw">Kata sandi</label>
      <input id="login-pw" type="password" autocomplete="current-password" required>
      <p id="login-err" class="error" role="alert" hidden></p>
      <button class="btn primary" type="submit" id="login-btn">Masuk</button>
    </form>
  </div>

  <!-- Aplikasi -->
  <div id="app" class="app" hidden>
    <aside class="rail">
      <div class="brand">
        <img class="brand-logo" src="img/logo-kumparan.webp" alt="kumparan" width="1024" height="256">
      </div>
      <nav id="nav" class="nav" aria-label="Fitur"></nav>
      <div class="rail-foot">
        <label class="switch" for="audit-toggle" title="Cek ulang draf terhadap bahan sumber setelah hasil keluar">
          <input id="audit-toggle" type="checkbox">
          <span>Cek ulang otomatis</span>
        </label>
        <p id="engine" class="engine"></p>
        <button id="logout" class="link-btn" type="button">Keluar</button>
      </div>
    </aside>
    <main class="desk" id="desk"></main>
  </div>

  <footer><div class="wrap">© <span id="yr"></span> kumparan (nrm). Semua hak dilindungi.</div></footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/verify.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
